    # outside the service bind mount, so keeping that stale path would make a
    # clean rebuild fail profile validation.
    version: "2"
    reference_audio: /data/references/ref.wav
    reference_text: /data/references/ref.txt
    clone_mode: icl
  bernardo_xvec_v1:
