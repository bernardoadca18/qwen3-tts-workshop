x-neovids-logging: &neovids-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  qwen-tts:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    container_name: qwen3-tts
    ports:
      # Required for separately deployed Orchestrator containers to reach
      # host.docker.internal. Keep this service on a trusted/private host.
      - "8889:8889"
    volumes:
      - ./cache/huggingface:/models/hf
      - ./data/references:/data/references:ro
      - ./data/jobs:/data/jobs
      - ./data/outputs:/data/outputs
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      MODEL_REVISION: ${MODEL_REVISION:-fd4b254389122332181a7c3db7f27e918eec64e3}
      DEVICE: ${DEVICE:-cuda:0}
      DTYPE: ${DTYPE:-float16}
      ATTENTION_IMPL: ${ATTENTION_IMPL:-sdpa}
      VOICE_PROFILES_FILE: /app/config/voices.yaml
      GENERATION_PROFILES_FILE: /app/config/generation_profiles.yaml
      REFERENCES_DIRECTORY: /data/references
      DEFAULT_VOICE_PROFILE: ${DEFAULT_VOICE_PROFILE:-bernardo_xvec_v3}
      DEFAULT_GENERATION_PROFILE: ${DEFAULT_GENERATION_PROFILE:-narration_v2}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-32}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-50000}
      TARGET_CHUNK_CHARS: ${TARGET_CHUNK_CHARS:-250}
      MAX_CHUNK_CHARS: ${MAX_CHUNK_CHARS:-400}
      CHUNK_MAX_DURATION_SECONDS: ${CHUNK_MAX_DURATION_SECONDS:-90}
      CHUNK_MAX_SECONDS_PER_CHAR: ${CHUNK_MAX_SECONDS_PER_CHAR:-0.35}
      CHUNK_DURATION_GRACE_SECONDS: ${CHUNK_DURATION_GRACE_SECONDS:-10}
      CHUNK_MIN_PEAK_AMPLITUDE: ${CHUNK_MIN_PEAK_AMPLITUDE:-0.000001}
      OUTPUT_DIRECTORY: /data/outputs
      JOB_DATABASE_PATH: /data/jobs/narrations.sqlite3
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-168}
      MAX_EPHEMERAL_PROMPT_CACHE_ENTRIES: ${MAX_EPHEMERAL_PROMPT_CACHE_ENTRIES:-8}
      SPEAKER_IDENTITY_DIAGNOSTICS_ENABLED: ${SPEAKER_IDENTITY_DIAGNOSTICS_ENABLED:-true}
      SPEAKER_SIMILARITY_WARNING_THRESHOLD: ${SPEAKER_SIMILARITY_WARNING_THRESHOLD:-0.985}
      WARMUP_ENABLED: ${WARMUP_ENABLED:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "4gb"
    tmpfs:
      - /tmp:size=2g,mode=1777
    restart: "no"
    init: true
    logging: *neovids-logging
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
